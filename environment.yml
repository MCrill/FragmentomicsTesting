name: cfdna-fragmentomics
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10
  - fastp=0.23.4
  - bwa-mem2=2.2.1
  - samtools=1.19
  - bedtools=2.31
  - htslib=1.19        # bgzip, tabix
  - multiqc=1.21
  - numpy>=1.23
  - scipy>=1.10
  - click>=8.1
  - pysam>=0.21
  - pip
  - pip:
      - -e .
