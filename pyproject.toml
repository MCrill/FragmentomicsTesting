[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdna-fragmentomics-nupem"
version = "0.1.0"
description = "A reproducible cfDNA fragmentomics pipeline featuring the novel NuPEM (Nucleosome-Phased End-Motif) coupling metric."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Morgan" }]
keywords = ["bioinformatics", "cfDNA", "fragmentomics", "liquid-biopsy", "nucleosome", "end-motif"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.23",
    "click>=8.1",
]

[project.optional-dependencies]
bam = ["pysam>=0.21"]
peaks = ["scipy>=1.10"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "scipy>=1.10"]
all = ["pysam>=0.21", "scipy>=1.10"]

[project.scripts]
fragmentomics = "fragmentomics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
